<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pagetile — paged editor (stub)</title>
<!-- The verbatim family stylesheet (editor chrome). Board rules are harmless no-ops here. -->
<link rel="stylesheet" href="pagetile.css" />
<style>
  /* MINIMAL stub-only layout. The real chrome (outline rail, page canvas, reader) grows later;
     this just proves the wiring: model ↔ outline ↔ shared editor. Authentic pagetile styling
     belongs in styles.css (the family's single source), not inline here. */
  :root { --rail: 240px; }
  body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; height: 100vh; }
  #rail { width: var(--rail); border-right: 1px solid #ddd; overflow: auto; padding: 8px; box-sizing: border-box; }
  #rail h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #888; margin: 12px 4px 4px; }
  #rail .pt-page { padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #rail .pt-page.is-active { background: #ece6f4; }
  #rail .pt-chapter { font-weight: 600; padding: 4px; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage .pt-hd { padding: 8px 12px; border-bottom: 1px solid #eee; display: flex; gap: 12px; align-items: center; font-size: 13px; }
  #imgs { display: flex; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
  #imgs .pt-img { font-size: 12px; color: #875fb6; border: 1px dashed #c9b6e4; border-radius: 6px; padding: 4px 8px; }
  #editor { flex: 1; min-height: 0; overflow: auto; }
  button { font: inherit; }
</style>
</head>
<body>
  <nav id="rail"><h2>pagetile (stub)</h2></nav>
  <main id="stage">
    <div class="pt-hd">
      <strong id="pt-title">—</strong>
      <span id="pt-pos" style="color:#888"></span>
      <span style="flex:1"></span>
      <button id="pt-prev">‹ prev</button>
      <button id="pt-next">next ›</button>
    </div>
    <div id="imgs"></div>
    <div id="editor"></div>
  </main>

  <!-- The Obsidian-flavour shim FIRST (gives the engine its DOM sugar + setIcon + Modal in the browser),
       then the shared editor engine, then pagetile's own model + host glue. Same load order as tugtile-w. -->
  <script src="obsidian-shim.js"></script>
  <script type="module">
    import { mountEditor, equipEditor } from './vendor/tile-core.js';
    import { parseBook, serializeBook, flattenPages } from './book-core.js';
    import { makePageHost } from './host.js';

    // Demo book so the stub renders something. Real pagetile loads a .md book file (a pagetile Site source)
    // or talks to a Site backend; that I/O layer is the APP layer and is intentionally not built here.
    const DEMO = [
      '---', 'pagetile-book: true', 'title: Demo Book', '---', '',
      '# Chapter 1', '', '## Page 1', '![[cover.png]]', 'The journey begins.', '',
      '## Page 2', '![[p002.png]]', 'A quiet morning.', '',
      '# Chapter 2', '', '## Page 1', '![[p003.png]]', 'Somewhere new.', '',
    ].join('\n');

    let book = parseBook(DEMO);
    let flat = flattenPages(book);
    let cur = 0;          // index into flat (reading order)
    let ctrl = null, rig = null;

    const $ = (id) => document.getElementById(id);

    function renderRail() {
      const rail = $('rail');
      rail.querySelectorAll('.pt-chapter, .pt-page').forEach((n) => n.remove());
      book.chapters.forEach((c) => {
        rail.appendChild(Object.assign(document.createElement('div'), { className: 'pt-chapter', textContent: c.title || '(untitled chapter)' }));
        c.pages.forEach((p) => {
          const fi = flat.findIndex((e) => e.page === p);
          const el = Object.assign(document.createElement('div'), { className: 'pt-page' + (fi === cur ? ' is-active' : ''), textContent: p.title || '(untitled page)' });
          el.onclick = () => { commit(); cur = fi; mountPage(); };
          rail.appendChild(el);
        });
      });
    }

    function mountPage() {
      const { chapter, page } = flat[cur];
      $('pt-title').textContent = (chapter.title ? chapter.title + ' · ' : '') + (page.title || '(untitled)');
      $('pt-pos').textContent = (cur + 1) + ' / ' + flat.length;
      const imgs = $('imgs'); imgs.innerHTML = '';
      page.images.forEach((img) => imgs.appendChild(Object.assign(document.createElement('span'), { className: 'pt-img', textContent: '🖼 ' + img.src })));
      // Mount the SHARED family editor on the page's caption — zero pagetile-specific editor code.
      const host = makePageHost();
      if (rig) { rig.destroy(); rig = null; }
      if (ctrl) { ctrl.destroy(); ctrl = null; }
      const ed = $('editor'); ed.innerHTML = '';
      ctrl = mountEditor(ed, { text: page.caption || '', onChange: () => {} }, host);
      rig = equipEditor({ mount: ed, ctrl, enabledModes: {} });
      renderRail();
    }

    // Pull the editor's current text back into the model. A real build would persist serializeBook(book).
    function commit() { if (ctrl && flat[cur]) flat[cur].page.caption = ctrl.rawValue(); }

    $('pt-prev').onclick = () => { commit(); cur = (cur - 1 + flat.length) % flat.length; mountPage(); };
    $('pt-next').onclick = () => { commit(); cur = (cur + 1) % flat.length; mountPage(); };

    mountPage();
    // serializeBook(book) round-trips to the .md source a pagetile Site deploys to CF Pages.
    window.__pagetile = { book, get md() { commit(); return serializeBook(book); } };
  </script>
</body>
</html>
