<!-- The Card editor's markup — the <body> only. serve/gen-edit3-assets.mjs takes this file as it is,
     and card-worker.mjs's editorHtml() puts it inside the page with the stylesheets, the options
     (window.__CARDTILE_W3_OPTS__) and the module (w3/edit3.mjs). Every id here is one edit3.mjs wires.

     Two modes, one markup: in the public sandbox (/try/edit) Save opens the door into the real thing
     (there is no account behind it); in host mode (/edit?host=, inside the dashboard) Save talks to the
     parent. Nothing is fixed on screen for the sandbox: its sign-in entry ("kept in this browser") is
     the first row of Cards settings, and Start over is in that panel's red group at the bottom.

     🔴 ONE GLASS LAYER for anything opened (a tile's sheet, the picker, Cards settings, the door, a
     tile up close): the whole screen, this top bar included, goes under frosted glass, and only the
     glass's ✕ (#close, last below) floats above it, at the top-left where the logo is. -->

<!-- THE NOTICE, top edge: status, progress and errors (waiting for the page, saving, not saved, could not
     open). A full-width bar that pushes the page down, never floats over it (w3/notice.mjs). -->
<div class="notice notice-top bleedblend-top bleedblend-push" id="notice-top" role="status" aria-live="polite" hidden><p class="notice-text"></p><button type="button" class="notice-act" hidden></button></div>

<header>
  <a class="lockup" id="lockup" href="https://feelreef.com/" aria-label="REEF with Cards"><svg class="lk-mark" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lk-grow" x1="50" y1="86" x2="48" y2="16" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0e5e6b"/><stop offset=".5" stop-color="#14a3b3"/><stop offset="1" stop-color="#ff8a68"/></linearGradient><linearGradient id="lk-sun" x1="50" y1="86" x2="48" y2="16" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f2795c"/><stop offset="1" stop-color="#ffc48a"/></linearGradient><linearGradient id="lk-deep" x1="20" y1="12" x2="80" y2="92" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14505c"/><stop offset="1" stop-color="#08303a"/></linearGradient></defs><circle class="lk-disc" cx="50" cy="50" r="46"/><g class="lk-coral" fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M 39.5 78.2 C 39.6 62 39.8 46 40 29.3"/><path d="M 40 29.3 C 37.7 29.2 33.4 28.1 30.7 22.5"/><path d="M 40 29.3 C 42.3 29.2 46.6 28.1 49.3 22.1"/><path d="M 39.5 62 C 33.3 61.6 28.8 59.8 26.5 56.5 C 24.8 54 23.8 50.8 23.7 47.5"/><path d="M 39.7 53.8 C 44.1 49.5 49.6 46.1 55.6 44.1 C 62 41.9 69.5 41.6 76.8 44.1"/><path d="M 62.6 42.2 C 64.1 40.7 66.4 37.3 64.8 31.8"/></g></svg><b aria-hidden="true">Cards</b></a>
  <button class="icon-btn" id="cardset" type="button" data-l-label="options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
  <div class="modes" role="group" data-l-label="viewsAria">
    <button type="button" data-view="stack" aria-pressed="false"></button>
    <button type="button" data-view="list" aria-pressed="false"></button>
    <button type="button" data-view="wall" aria-pressed="false"></button>
  </div>
  <!-- the main action, far right: Edit while looking, Save while editing -->
  <button class="hd-main" id="editbtn" type="button"></button>
</header>

<main id="preview" hidden><iframe id="deckframe" data-l-title="previewFrame"></iframe></main>
<main id="edit"><div class="row" id="row"></div></main>
<main id="layout" hidden>
  <iframe id="gridframe" data-l-title="wallFrame"></iframe>
</main>
<!-- THE NOTICE, bottom edge: transient confirmations (deleted + Undo, saved, replaced). Pushes the page up;
     while a sheet is open it moves into that sheet, above its buttons. -->
<div class="notice notice-bottom bleedblend-bottom bleedblend-push" id="notice-bottom" role="status" aria-live="polite" hidden><p class="notice-text"></p><button type="button" class="notice-act" hidden></button></div>

<!-- "+": the kinds of tile in one list -->
<div class="ctw-modal" id="picker" hidden>
  <div class="ctw-modal-panel ctw-pick" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <h2 id="picker-title" data-l="addTile"></h2>
    <p class="ctw-modal-hint" data-l="pickHint"></p>
    <div class="ctw-pick-row" id="picker-row"></div>
  </div>
</div>

<!-- the pencil's sheet (and the whole file's raw content): the field ids inside are cell-form-core's own (f-<name>, e-<name>) -->
<div class="ctw-modal" id="modal" hidden>
  <div class="ctw-modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <p class="ctw-modal-hint" id="modal-hint"></p>
    <div id="modal-body"></div>
    <div class="ctw-modal-foot" id="modal-foot">
      <button class="ctw-btn ctw-btn-danger" id="modal-delete" type="button" data-l="deleteTile"></button>
      <span class="modal-why" id="modal-why" aria-live="polite"></span>
      <button class="ctw-btn ctw-btn-go" id="modal-save" type="button" data-l="done"></button>
    </div>
  </div>
</div>

<!-- Cards settings (w3/settings-nav.mjs is its shape): a panel that slides up from the bottom of the glass and
     back down when closed. Narrow, iOS Settings (pages pushed from the right); wide, iPadOS Settings (a sidebar
     and the group's rows). Changes go into the draft at once; the top bar's Save is how they are saved. -->
<div class="set-layer" id="settings" hidden>
  <div class="set-panel" id="set-panel" tabindex="-1" role="dialog" aria-modal="true" data-l-label="options">
    <div class="set-pages" id="set-pages"></div>
    <div class="set-confirm" id="set-confirm" hidden></div>
    <div class="set-note ctw-modal-foot"></div>
  </div>
</div>
<input type="file" id="opt-file" accept=".md,text/markdown,text/plain" hidden>

<!-- SANDBOX ONLY: Save, with no account behind it, is the door into the real creation flow -->
<div class="ctw-modal" id="doormodal" hidden>
  <div class="ctw-modal-panel ctw-door" role="dialog" aria-modal="true" aria-labelledby="door-title">
    <h2 id="door-title"></h2>
    <p class="ctw-modal-hint" id="door-note"></p>
    <div class="ctw-modal-foot">
      <button class="ctw-btn" id="door-back" type="button"></button>
      <button class="ctw-btn ctw-btn-go" id="door-go" type="button"></button>
    </div>
  </div>
</div>

<!-- leaving the row or the wall with an unsaved draft: Save / Keep editing / Discard (w3/leave-edit.mjs) -->
<div class="ctw-modal ctw-small" id="leavemodal" hidden>
  <div class="ctw-modal-panel ctw-leave" role="alertdialog" aria-modal="true" aria-labelledby="leave-title">
    <h2 id="leave-title" data-l="leaveTitle"></h2>
    <div class="ctw-modal-foot">
      <button class="ctw-btn ctw-btn-danger" id="leave-discard" type="button" data-l="leaveDiscard"></button>
      <button class="ctw-btn" id="leave-keep" type="button" data-l="leaveKeep"></button>
      <button class="ctw-btn ctw-btn-go" id="leave-save" type="button" data-l="save"></button>
    </div>
  </div>
</div>

<div class="zoom" id="zoom" hidden></div>
<button class="glass-close" id="close" type="button" data-l-label="close" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
<!-- the assistant palette (⌘K, and the sparkle button): a stand-in that changes nothing yet. It sits UNDER
     every overlay, so an open layer's backdrop blurs it with the page. (lucide sparkle) -->
<button class="seek" id="seek" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></button>
<div class="pal" id="pal" hidden><div class="pal-box" role="dialog" aria-modal="true"><input id="pal-q" type="text" autocomplete="off"><p class="pal-say" id="pal-say"></p><p class="pal-ans" id="pal-ans" hidden></p></div></div>
