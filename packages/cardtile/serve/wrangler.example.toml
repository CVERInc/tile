# ─────────────────────────────────────────────────────────────────────────────────────────────────
# EXAMPLE deployment config. Copy it, fill in your own account and routes, deploy with
#   npx wrangler deploy --config <your-copy.toml>
#
# 🔴 THIS FILE IS THE SHAPE, NOT OUR DEPLOYMENT. The real one names a Cloudflare account, a KV
# namespace, a workers.dev subdomain and the creators whose domains point at this Worker — which is
# a record of who our customers are and how our account is laid out, not a part of the product. It
# lives in our own private workspace for the same reason their cards do.
#
# 🩸 Two of those four used to be here anyway. The account id was a placeholder from the start, and
# right beside it sat the real KV namespace id (twice) and the real workers.dev hostname — because
# they read as "the config", not as "the account". A file that says it is de-identified is the
# easiest place in a repo to stop looking. Everything angle-bracketed below is yours to fill in.
#
# Everything below the placeholders is the actual config: the bindings the Worker needs, the routing
# topology, and the scars that explain why each line is the way it is.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

# REEF with Card — the multi-tenant edge renderer. Deploy:
#   CLOUDFLARE_API_TOKEN=<your token> npx wrangler deploy
# The CARDS KV holds card:<handle>:<gen> → card.md (gen = the value of gen:<handle>, absent ⇒ 0;
# see genKey in card-api.mjs). Create once, then paste the id below:
#   CLOUDFLARE_API_TOKEN=… npx wrangler kv namespace create CARDS
#   CLOUDFLARE_API_TOKEN=… npx wrangler kv key put --binding=CARDS card:<handle>:0 --path=<card.md>   # a new handle
# A domain binding lives under the same generation's keys (vanitybind:<handle>:<gen>:<host>,
# vanityof:<handle>:<gen>); vanity:<host> → handle is only a pointer, written last and only by the
# HostBindings Durable Object for that host, after the bind registered with the handle's CardLifetime
# object (below) — see vanityKey, and cards/README.md for the commands and the deploy order.
#   preview (default): npx wrangler deploy                 → cardtile-preview.<your-subdomain>.workers.dev
#   production:        npx wrangler deploy --env production → cardtile + its custom domains
# Same code, same CARDS store; they differ only in PREVIEW (which gates the noindex header) and in
# which hostnames route to them. Naming follows the fleet convention: `<name>` / `<name>-preview`.
name = "cardtile-preview"
main = "card-worker.mjs"
compatibility_date = "2026-07-01"
account_id = "<your-cloudflare-account-id>"
workers_dev = true

[vars]
PREVIEW = "true"          # → X-Robots-Tag: noindex (a preview must never outrank the real card)
# CARD_NOINDEX_ALL = "1"  # kill switch (reef#2044): uncomment/set to put `X-Robots-Tag: noindex` on EVERY
#                         # card response, vanity hosts included. Default off. Per-environment: set it under
#                         # [env.production.vars] too. Remove it (or "0") to resume indexing.

# card store (card:<handle>:<gen> → card.md). Create it once (see the header) and paste its id here.
[[kv_namespaces]]
binding = "CARDS"
id = "<your-cards-kv-namespace-id>"

# The ONE writer of vanity:<host> (card-api HostBindings, reef#2618 r6, r7): one Durable Object per host.
# 🔴 Preview binds PRODUCTION's class, not one of its own. Both Workers write the same CARDS store, so
# two namespaces would be two writers per host, which is the race the object exists to remove. It
# follows that `cardtile` (with its migration below) must be deployed before this Worker can bind.
[[durable_objects.bindings]]
name = "HOST_BINDINGS"
class_name = "HostBindings"
script_name = "cardtile"

# The ONE authority for a handle's lifetime (card-api CardLifetime, reef#2618 r8): one Durable Object
# per handle, holding its generation and the hosts bound in it; it is the only writer of gen:<handle>.
# Production's class, for the same reason as above: two namespaces would be two lifetimes per handle.
[[durable_objects.bindings]]
name = "CARD_LIFETIMES"
class_name = "CardLifetime"
script_name = "cardtile"

# ── production ─────────────────────────────────────────────────────────────────────────────────
# The native replacement for the legacy Python renderer. A creator's own host is a VANITY host (see the
# worker's VANITY map) — the canonical form is card.feelreef.com/<handle>, added once that hostname
# is pointed here. Rollback is a DNS change: the Python renderer stays frozen, not deleted.
[env.production]
name = "cardtile"
workers_dev = true
account_id = "<your-cloudflare-account-id>"

routes = [
  { pattern = "card.example.com", custom_domain = true },   # ← a creator's own domain
  # 🔴 The multi-tenant origin. NOT a custom_domain — a plain route on our own zone, over an
  # originless `saas.feelreef.com AAAA 100::`. This is the fallback origin Cloudflare for SaaS sends
  # custom-hostname traffic to, and it is deliberately testable on its own: a creator's domain is not
  # required to prove the Worker answers here.
  #
  # Why SaaS at all: a creator's zone lives in THEIR Cloudflare account, and Workers Custom Domains
  # refuse that outright — "You cannot create a Custom Domain on a hostname with an existing CNAME
  # DNS record or on a zone you do not own." Asking a creator to move their DNS to us would be worse
  # than the platform they are leaving; Portaly only asks for a CNAME, and so do we.
  { pattern = "saas.feelreef.com/*", zone_name = "feelreef.com" },
  # 🔴 The CANONICAL host, and it was not routed here until 2026-07-30 — while `CANON_HOST` in
  # card-worker.mjs named it and `resolveHandle` built every non-vanity card's `cardUrl` from it.
  # That URL is what the QR encodes. Measured before the fix: card.feelreef.com/<handle> → 301 to
  # feelreef.com. All three live cards have vanity domains so nothing was broken today; the FIRST
  # card without one would have shipped a QR that scans to the marketing site — and a QR is a thing
  # people discover after it is printed.
  #
  # A plain route, not a custom_domain, for a different reason than saas: `card.feelreef.com` is
  # already a proxied CNAME to feelreef.pages.dev (the marketing site), and a Custom Domain refuses a
  # hostname that has one. A route wins over the origin without touching DNS — so this is reversible
  # by deleting one line, and deleting it puts the 301 back exactly as it was.
  { pattern = "card.feelreef.com/*", zone_name = "feelreef.com" },
]

[env.production.vars]
PREVIEW = "false"

[[env.production.kv_namespaces]]
binding = "CARDS"
id = "<your-cards-kv-namespace-id>"

# The class lives here (see the preview binding above). Durable Object bindings are not inherited by
# an environment, so it is declared again. The migration creates the class: the first deploy that
# carries it IS the migration, and the tag is never edited or reused once deployed.
# SQLite-backed (`new_sqlite_classes`) because Cloudflare offers only that kind on the Free plan and
# recommends it for every new class. Since r7 each object stores one small record (the host's owner,
# its admission ticket counter and the lifetimes it was told ended) through the storage get/put API,
# which the SQLite backend serves too. Never deploy `deleted_classes` for it: that erases those records.
[[env.production.durable_objects.bindings]]
name = "HOST_BINDINGS"
class_name = "HostBindings"

[[env.production.durable_objects.bindings]]
name = "CARD_LIFETIMES"
class_name = "CardLifetime"

[[env.production.migrations]]
tag = "v1-host-bindings"
new_sqlite_classes = ["HostBindings"]

# r8: CardLifetime has a tag of its own rather than joining v1. Cloudflare applies each tag once, so
# a tag that may already be deployed must never change; whether v1 is cannot be known from here, and
# a new tag is right either way (deployed: only v2 runs; not yet: both run, in order). Same storage
# API and the same "never deleted_classes" rule: deleting it forgets every handle's generation.
[[env.production.migrations]]
tag = "v2-card-lifetime"
new_sqlite_classes = ["CardLifetime"]

# ── Secrets (set with `wrangler secret put`, never in this file) ──────────────────────────────────
# WEB_RISK_API_KEY — Google Web Risk API key. card save (PUT /_api/card/<handle>) looks up every
#   outbound href/src the renderer would emit and refuses a listed one with 422 card_url_unsafe.
#   Unset, a timeout (3 s) or a non-2xx answer lets the save through with one log line — fail-open
#   on purpose (see serve/url-risk.mjs). The key never appears in logs or responses.
