<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>modaltile — the full-screen single-post editor</title>
<!-- The family stylesheet (editor chrome), verbatim from ../styles.css via build.sh. -->
<link rel="stylesheet" href="tile-family.css" />
<!-- modaltile's OWN chrome: the .ej-* modal shell, plus the Obsidian CSS-variable shim the
     shared engine's rules depend on. -->
<link rel="stylesheet" href="modaltile.css" />
<style>
  body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  #bar { padding: 10px 14px; border-bottom: 1px solid #e5e5e5; display: flex; gap: 12px; align-items: center; font-size: 13px; }
  #bar b { font-weight: 600; }
  #bar .muted { color: #888; }
  #log { padding: 10px 14px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; color: #444; }
  button { font: inherit; padding: 4px 10px; }
</style>
</head>
<body>

<div id="bar">
  <b>modaltile</b>
  <button id="open">Open the editor</button>
  <span class="muted">Standalone, no backend — the fake fetch below IS the host</span>
</div>
<div id="log"></div>

<!--
  A STANDALONE HARNESS, and the point of it: modaltile talks to a host through a handful of JSON
  endpoints and nothing else. If it runs here — against a fake fetch and no server at all — then
  the surface really is host-agnostic, and any host that answers these six routes can mount it.

  Serve over http (ESM imports are blocked on file:// by CORS):
      python3 -m http.server 8731     →     http://localhost:8731/modaltile-w/
-->
<!-- 🔴 editabilize.js AUTORUNS on import unless a host opts out. Without this line it tries to
     editabilize THIS page, finds no `.entry-content`, and logs an error that has nothing to do with
     the modal — which is exactly what the first smoke run caught. ejecta's admin sets the same flag;
     it was never written down anywhere, so it is in the host contract now. -->
<script>window.__EJECTA_NO_AUTORUN = true;</script>
<script type="module">
import './obsidian-shim.js';
import { openEditorModal } from './modaltile-core.js';

const log = (m) => { document.getElementById('log').textContent += m + '\n'; };

// The whole host contract, in one place. Six routes; everything else modaltile does is local.
const POST = {
  ok: true,
  title: 'Sample post',
  status: 'draft',
  body_format: 'md',
  // One CJK line on purpose: this editor is used on CJK content, so the bench should set some.
  body: '## A heading\n\nOrdinary text, **bold**, `code`.\n\n中文一行，證明它排得對。\n\n- One\n- Two\n',
};
const realFetch = window.fetch.bind(window);
window.fetch = async (url, init) => {
  const u = String(url);
  const body = init?.body ? JSON.parse(init.body) : null;
  if (u.includes('/api/post/'))   { log('GET  /api/post/…');                     return json(POST); }
  if (u.includes('/api/field'))   { log(`POST /api/field   ${body.field}=${body.value}`); return json({ ok: true }); }
  if (u.includes('/api/save'))    { log(`POST /api/save    ${body.md.length} chars of markdown`); return json({ ok: true }); }
  if (u.includes('/api/publish')) { log('POST /api/publish');                    return json({ ok: true }); }
  if (u.includes('/api/unpublish')) { log('POST /api/unpublish');                return json({ ok: true }); }
  if (u.includes('/api/delete'))  { log('POST /api/delete');                     return json({ ok: true }); }
  // No livepage proxy here, so the smart-preview path falls back to /api/preview — exactly what it
  // does on a host that has no mirror to splice into.
  if (u.includes('/_ejecta/livepage')) { log('GET  /_ejecta/livepage → 404 (no proxy; falls back)'); return new Response('', { status: 404 }); }
  if (u.includes('/api/preview')) { log('POST /api/preview'); return json({ ok: true, url: 'about:blank' }); }
  return realFetch(url, init);
};
const json = (o) => new Response(JSON.stringify(o), { headers: { 'content-type': 'application/json' } });

document.getElementById('open').onclick = () => openEditorModal('demo-post', {});
log('ready — press the button above');
</script>
</body>
</html>
