<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Settings</title>
<style>
  /* A settings pane, not a web page: system font at the Mac control size, native checkboxes (WebKit draws
     them with the person's accent colour), and the window's own background showing through. */
  :root {
    color-scheme: light dark;
    --text-normal: #1d1d1f;
    --text-muted: #6e6e73;
    --group: rgba(0, 0, 0, 0.035);
    --border: rgba(0, 0, 0, 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root { --text-normal: #f2f2f7; --text-muted: #9b9ba0; --group: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); }
  }
  html, body { margin: 0; background: transparent; }
  body {
    font: 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--text-normal);
    padding: 20px 24px 24px;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  section { margin: 0 0 18px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
  p { margin: 0 0 8px; color: var(--text-muted); font-size: 12px; line-height: 1.4; }
  .group {
    background: var(--group); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 12px;
  }
  label { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  input { margin: 0; }
  .ic { width: 16px; height: 16px; display: inline-flex; color: var(--text-muted); }
  .ic svg { width: 16px; height: 16px; }
  .note { min-height: 16px; margin-top: 6px; }
  .group.single { display: block; padding: 10px 12px; }
  select { font: 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./settings.js"></script>
</body>
</html>
