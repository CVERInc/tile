<!doctype html>
<html lang="zh-TW">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tugtile · web</title>

<!-- Real tugtile stylesheet (verbatim) + real class names + real SortableJS drag engine. -->
<link rel="stylesheet" href="tugtile.css">

<style>
  /* Obsidian default-theme variable shim — exact values from obsidian.asar app.css colour-base scale. */
  :root {
    --font-interface: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
    --font-text: var(--font-interface); --font-normal: var(--font-interface);
    --font-monospace: ui-monospace, "SF Mono", Menlo, monospace;
    --font-text-size: 16px; --font-medium: 500;
    --radius-s: 4px; --radius-m: 8px;
    --interactive-accent: hsl(258, 88%, 66%); --text-on-accent: #ffffff;
    --color-red: #e0566b; --color-orange: #e08d3c; --color-yellow: #e0c341;
    --color-green: #5bbf7a; --color-cyan: #46b5c9; --color-purple: #a77bca;
    --shadow-l: 0 6px 22px rgba(0,0,0,.35);
    --tugtile-lane-width: 300px;
  }
  @media (prefers-color-scheme: dark) { :root {
    --background-primary: #1e1e1e; --background-secondary: #262626;
    --background-modifier-border: #363636; --background-modifier-border-hover: #3f3f3f;
    --background-modifier-form-field: rgba(0,0,0,.3); --background-modifier-hover: rgba(255,255,255,.067);
    --text-normal: #dadada; --text-muted: #b3b3b3; --text-faint: #666666;
    --text-accent: hsl(258, 88%, 75%); --text-error: #ff6b6b; --text-success: #54c98a;
  }}
  @media (prefers-color-scheme: light) { :root {
    --background-primary: #ffffff; --background-secondary: #f6f6f6;
    --background-modifier-border: #e0e0e0; --background-modifier-border-hover: #d4d4d4;
    --background-modifier-form-field: #ffffff; --background-modifier-hover: rgba(0,0,0,.067);
    --text-normal: #222222; --text-muted: #5c5c5c; --text-faint: #ababab;
    --text-accent: hsl(258, 68%, 52%); --text-error: #c0392b; --text-success: #2f9e5e;
  }}

  html, body { height: 100%; margin: 0; background: var(--background-primary); }
  body { display: flex; flex-direction: column; font-family: var(--font-interface); color: var(--text-normal); }
  .svg-icon { width: 1em; height: 1em; }
  .tugtile { flex: 1; min-height: 0; position: relative; }

  .tw-header { display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 8px; background: var(--background-primary); border-bottom: 1px solid var(--background-modifier-border); flex: 0 0 auto; position: relative; z-index: 10; }   /* above the view-swap snapshot (.tugtile-viewsnap, which slides up over the board area) */
  .tw-cluster { display: flex; align-items: center; gap: 2px; }
  .tw-left { flex: 1; justify-content: flex-start; }
  .tw-right { flex: 1; justify-content: flex-end; }
  .tw-iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: var(--radius-s); color: var(--text-muted); cursor: pointer; }
  .tw-iconbtn:hover { background: var(--background-modifier-hover); color: var(--text-normal); }
  .tw-iconbtn svg { width: 17px; height: 17px; }
  .tw-search { font: inherit; font-size: 13px; background: var(--background-modifier-form-field); color: var(--text-normal); border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s); padding: 4px 8px; width: 160px; outline: none; }
  .tw-search:focus { border-color: var(--interactive-accent); }
  .tugtile-sep { color: var(--text-faint); }
  .tugtile-viewcycle, .tugtile-brand { cursor: pointer; }   /* .tugtile-viewsnap swap animation comes from tugtile.css */

  .tugtile__tile-body :is(h1,h2,h3,h4,h5,h6), .tugtile__tile-title :is(h1,h2,h3,h4,h5,h6) { font-weight: 650; line-height: 1.3; color: var(--text-normal); margin: .3em 0; }
  .tugtile__tile-body h1 { font-size: 1.6em; } .tugtile__tile-body h2 { font-size: 1.4em; } .tugtile__tile-body h3 { font-size: 1.2em; }
  .tugtile__tile-body h4 { font-size: 1.1em; } .tugtile__tile-body h5 { font-size: 1em; } .tugtile__tile-body h6 { font-size: .9em; color: var(--text-muted); }
  .tugtile__tile-title h1 { font-size: 1.6em; } .tugtile__tile-title h2 { font-size: 1.4em; } .tugtile__tile-title h3 { font-size: 1.2em; }
  .tugtile__tile-body p, .tugtile__tile-title p { margin: .35em 0; line-height: 1.5; }
  .tugtile__tile-body ul, .tugtile__tile-body ol { margin: .3em 0; padding-left: 1.3em; }
  .tugtile__tile-body li { margin: .12em 0; }
  .tugtile__tile-body code, .tugtile__tile-title code { font-family: var(--font-monospace); font-size: .9em; background: var(--background-modifier-hover); border-radius: 4px; padding: .1em .35em; }
  .tugtile__tile-body del, .tugtile__tile-title del { color: var(--text-muted); }
  .tugtile__tile-body a, .tugtile__tile-title a, .tag, .lnk { color: var(--text-accent); text-decoration: none; }
  .tag { cursor: pointer; }
  .tugtile__tile-body em { font-style: italic; } .tugtile__tile-body strong { font-weight: 700; }

  /* context menu (web stand-in for Obsidian's Menu) */
  .tw-menu { position: fixed; z-index: 50; min-width: 184px; background: var(--background-secondary); border: 1px solid var(--background-modifier-border); border-radius: var(--radius-m); box-shadow: var(--shadow-l); padding: 4px; font-size: 14px; }
  .tw-mi { display: flex; align-items: center; gap: 9px; padding: 6px 10px; border-radius: var(--radius-s); cursor: pointer; color: var(--text-normal); white-space: nowrap; }
  .tw-mi:hover { background: var(--background-modifier-hover); }
  .tw-mi svg { width: 15px; height: 15px; color: var(--text-muted); flex: 0 0 auto; }
  .tw-mi.danger { color: var(--text-error); } .tw-mi.danger svg { color: var(--text-error); }
  .tw-msep { height: 1px; background: var(--background-modifier-border); margin: 4px 6px; }
  /* modal */
  .tw-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
  .tw-modal { background: var(--background-primary); border: 1px solid var(--background-modifier-border); border-radius: var(--radius-m); box-shadow: var(--shadow-l); width: min(560px, 92vw); max-height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
  .tw-modal-h { font-weight: 700; font-size: 15px; padding: 14px 16px; border-bottom: 1px solid var(--background-modifier-border); }
  .tw-modal-b { padding: 14px 16px; overflow: auto; }
  .tw-modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--background-modifier-border); }
  .tw-field { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; background: var(--background-modifier-form-field); color: var(--text-normal); border: 1px solid var(--background-modifier-border); border-radius: var(--radius-s); padding: 8px 10px; outline: none; }
  .tw-field:focus { border-color: var(--interactive-accent); }
  textarea.tw-field { min-height: 180px; resize: vertical; font-family: var(--font-monospace); line-height: 1.5; }
  .tw-ed { min-height: 220px; }   /* the mounted tile-family editor renders its own chrome from tugtile.css */
  .tw-btn { font: inherit; font-size: 13px; font-weight: 600; border-radius: var(--radius-s); padding: 7px 14px; cursor: pointer; border: 1px solid var(--background-modifier-border); background: var(--background-secondary); color: var(--text-normal); }
  .tw-btn:hover { background: var(--background-modifier-hover); }
  .tw-btn.primary { background: var(--interactive-accent); color: var(--text-on-accent); border-color: var(--interactive-accent); }
  .tw-set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--background-modifier-border); }
  .tw-set-row:last-child { border-bottom: 0; }
  .tw-set-row label { color: var(--text-normal); font-size: 14px; }
  .tw-arc-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--background-modifier-border); }
  .tw-arc-row .txt { flex: 1; white-space: pre-wrap; word-break: break-word; font-size: 13px; color: var(--text-muted); }
  .tugtile__check { cursor: pointer; }
</style>

<body>
<div class="tw-header" id="header"></div>
<div class="tugtile"><div class="tugtile__board" id="board"></div></div>

<script src="./Sortable.min.js"></script>
<script type="module">
import { parseFile, serializeFile, parseWip, foldStateFrom, nextFold, foldTargets, FOLD_ICONS,
         extractMeta, extractTags, tilePlainText, parseDateStr, formatDateTokens } from './board-core.js';
import { ICONS } from './icons.js';   // authentic Lucide bodies extracted from obsidian.asar
import './obsidian-shim.js';          // lets the Obsidian-flavoured editor engine run in the browser
import { mountEditor, equipEditor } from './vendor/tile-core.js';   // the SHARED tile-family editor (modaltile)
import { makeWebHost } from './host.js';
const Sortable = window.Sortable;

/* ---- icons (real Lucide) ---- */
const svg = (n) => '<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[n] || '') + '</svg>';

/* ---- i18n: the plugin's own locale JSON (locale-aware t with {0} interpolation) ---- */
let TR = {};
const t = (k, ...a) => { let s = TR[k]; if (s == null) return k; if (Array.isArray(s)) return s; a.forEach((v, i) => { s = s.replace('{' + i + '}', v); }); return s; };

/* ---- markdown for card bodies ---- */
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inlineMd = (s) => esc(s)
  .replace(/(\*\*|__)(.+?)\1/g, '<strong>$2</strong>')
  .replace(/(?<![\*_])(\*|_)(?!\s)(.+?)(?<!\s)\1(?![\*_])/g, '<em>$2</em>')
  .replace(/~~(.+?)~~/g, '<del>$1</del>')
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m,a,b) => '<span class="lnk">' + (b||a) + '</span>')
  .replace(/(^|[^&\w])(#[^\s#<&]+)/g, '$1<span class="tag">$2</span>');
const blockHtml = (line) => {
  const h = /^(#{1,6})\s+(.*)$/.exec(line);
  if (h) return '<h' + h[1].length + '>' + inlineMd(h[2]) + '</h' + h[1].length + '>';
  const li = /^\s*[-*]\s+(?:\[([ xX])\]\s+)?(.*)$/.exec(line);
  if (li) return '<ul><li>' + inlineMd(li[2]) + '</li></ul>';
  return '<p>' + inlineMd(line) + '</p>';
};
const mdToHtml = (text) => String(text).split('\n').filter((l) => l.trim() !== '').map(blockHtml).join('') || '<p></p>';
const numbered = (html, n) => html.replace('>', '><span class="tugtile__num">' + n + '</span>');

/* ---- state ---- */
const board = document.getElementById('board');
let MODEL = null, TILES = [], COLS = [], cfg = {};
let cardsExpanded = false, locked = false, dragging = false, lastDragEnd = 0, expandedEl = null;
let viewMode = 'board', tableSort = null, searchTerm = '';
let fileHandle = null;
const sortables = [];
const DRAG_TOUCH = { delay: 180, delayOnTouchOnly: true, touchStartThreshold: 8, forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4 };
const SCROLL_EDGE = 70, SCROLL_MAX = 22;

/* ---- settings (from the board's %% tugtile:settings %% block) ---- */
function buildCfg(s) {
  s = s || {};
  const completeLane = (MODEL.columns || []).some((c) => (c.lead || []).join('\n').indexOf('**Complete**') !== -1);
  const tagColors = {};
  if (Array.isArray(s['tag-colors'])) s['tag-colors'].forEach((c) => { if (c && c.tagKey) tagColors[c.tagKey] = c; });
  return {
    showCheckbox: (s['show-checkboxes'] !== undefined) ? (s['show-checkboxes'] !== false) : completeLane,
    hideCounts: !!s['hide-card-count'],
    showRelativeDate: (s['show-relative-date'] !== undefined) ? !!s['show-relative-date'] : true,
    dateFormat: s['date-format'] || 'YYYY-MM-DD',
    dateDisplayFormat: s['date-display-format'] || 'YYYY-MM-DD',
    dateTrigger: s['date-trigger'] || '@',
    timeTrigger: s['time-trigger'] || '@@',
    moveTags: (s['move-tags'] !== undefined) ? !!s['move-tags'] : false,
    tagColors,
  };
}

/* ---- date chip (web port of formatDate / relativeDate / dateClass, on the shared parse/format core fns) ---- */
function formatDate(s) { const p = parseDateStr(s, cfg.dateFormat); return p ? formatDateTokens(p, cfg.dateDisplayFormat) : s; }
function dayDiff(s) { const p = parseDateStr(s, cfg.dateFormat); if (!p) return null; const d = new Date(p.y, p.mo - 1, p.d); d.setHours(0,0,0,0); const t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t) / 86400000); }
function relativeDate(s) { const diff = dayDiff(s); if (diff === null) return ''; const m = {0:t('today'),1:t('tomorrow'),'-1':t('yesterday'),2:t('dayAfterTomorrow'),'-2':t('dayBeforeYesterday')}; if (m[diff] !== undefined) return m[diff]; return diff > 0 ? t('daysLater', diff) : t('daysAgo', -diff); }
function dateClass(s) { const diff = dayDiff(s); if (diff === null) return 'tugtile__date--unknown'; if (diff < 0) return 'tugtile__date--overdue'; if (diff === 0) return 'tugtile__date--today'; if (diff <= 7) return 'tugtile__date--soon'; return 'tugtile__date--safe'; }
function dateChipHtml(meta) {
  if (!meta.date && !meta.time) return '';
  let h = '<div class="tugtile__date' + (meta.date ? ' ' + dateClass(meta.date) : '') + '">';
  if (meta.date) { let label = formatDate(meta.date); if (cfg.showRelativeDate) { const r = relativeDate(meta.date); if (r) label += t('relDateWrap', r); }
    h += '<span class="tugtile__date-d"><span class="tugtile__date-i">' + svg('calendar') + '</span><span>' + esc(label) + '</span></span>'; }
  if (meta.time) h += '<span class="tugtile__date-t"><span class="tugtile__date-i">' + svg('clock') + '</span><span>' + esc(meta.time) + '</span></span>';
  return h + '</div>';
}

/* ---- board render (real .tugtile__* DOM) ---- */
function tileHtml(tile, tid, n) {
  const meta = extractMeta(String(tile.text), cfg.dateTrigger, cfg.timeTrigger);   // strips @{}/@@{} tokens from the body
  const text = meta.clean;
  const first = (text.split('\n').find((l) => l.trim() !== '') || text).trim();
  const isLong = text.indexOf('\n') !== -1 || text.length > 60;
  const folded = isLong && !cardsExpanded;
  const cls = 'tugtile__tile' + (folded ? ' tugtile__tile--folded' : '');
  const cb = cfg.showCheckbox ? '<input type="checkbox" class="tugtile__check"' + ((tile.check && tile.check !== ' ') ? ' checked' : '') + '>' : '';
  const body = '<div class="tugtile__tile-body">' + numbered(mdToHtml(text), n) + '</div>';
  const title = isLong ? '<div class="tugtile__tile-title">' + numbered(mdToHtml(first), n) + '</div>' : '';
  return '<div class="' + cls + '" data-tid="' + tid + '" data-long="' + isLong + '" tabindex="0">'
    + '<div class="tugtile__tile-ctrls">' + cb + '<span class="tugtile__tile-more">' + svg('more-horizontal') + '</span></div>'
    + body + title + dateChipHtml(meta) + '</div>';
}
function laneHtml(col, ci) {
  const wip = parseWip(col.title || '');
  const tiles = col.tiles || [];
  const collapsed = !!col._collapsed;
  const cls = 'tugtile__lane' + (collapsed ? ' tugtile__lane--collapsed tugtile__lane--grown' : '');
  COLS[ci] = { header: col.header || ('## ' + (col.title || '')), lead: (col.lead || []) };
  const cards = tiles.map((tl) => { const tid = TILES.push(tl) - 1; return tileHtml(tl, tid, 0); }).join('');
  return '<div class="' + cls + '" data-ci="' + ci + '" data-collapsed="' + collapsed + '" data-wip="' + (wip.max == null ? '' : wip.max) + '">'
    + '<div class="tugtile__lane-head">'
    +   '<span class="tugtile__lane-chevron" role="button"><span class="tugtile__lane-chevron-glyph">' + svg('chevron-down') + '</span></span>'
    +   '<span class="tugtile__lane-title">' + esc(wip.title || '') + '</span>'
    +   '<span class="tugtile__lane-title-v" aria-hidden="true">' + esc(wip.title || '') + '</span>'
    +   '<span class="tugtile__lane-count">0</span>'
    +   '<span class="tugtile__lane-more">' + svg('more-horizontal') + '</span>'
    + '</div>'
    + '<div class="tugtile__list">' + cards + '</div>'
    + '<div class="tugtile__add"><div class="tugtile__add-btn">' + esc(t('addTileBtn')) + '</div></div>'
    + '</div>';
}
function renumberAll() {
  board.querySelectorAll('.tugtile__lane').forEach((lane) => {
    const tiles = lane.querySelectorAll('.tugtile__list > .tugtile__tile');
    tiles.forEach((tile, i) => tile.querySelectorAll('.tugtile__num').forEach((s) => { s.textContent = String(i + 1); }));
    const count = lane.querySelector('.tugtile__lane-count'); const max = lane.dataset.wip;
    if (count) {
      if (max) { count.textContent = tiles.length + ' / ' + max; count.classList.toggle('tugtile__lane-count--over', tiles.length > Number(max)); }
      else { count.textContent = String(tiles.length); count.classList.remove('tugtile__lane-count--over'); }
    }
  });
  refreshFoldBtn();
}
function decorateTags() {
  board.querySelectorAll('.tugtile__tile').forEach((tile) => {
    const tags = [...tile.querySelectorAll('.tag')];
    tags.forEach((el) => { const k = el.textContent.trim(); const c = cfg.tagColors[k];
      if (c) { if (c.backgroundColor) el.style.backgroundColor = c.backgroundColor; if (c.color) el.style.color = c.color; }
      el.onclick = (e) => { e.preventDefault(); e.stopPropagation(); searchTerm = k; applySearch(); };
    });
    if (cfg.moveTags && tags.length) {
      const ft = document.createElement('div'); ft.className = 'tugtile__tags';
      tags.forEach((a) => { const chip = document.createElement('span'); chip.className = 'tugtile__tag'; chip.textContent = a.textContent.trim();
        const c = cfg.tagColors[chip.textContent]; if (c) { if (c.backgroundColor) chip.style.backgroundColor = c.backgroundColor; if (c.color) chip.style.color = c.color; }
        chip.onclick = (e) => { e.stopPropagation(); searchTerm = chip.textContent; applySearch(); }; ft.appendChild(chip); a.remove(); });
      tile.appendChild(ft);
    }
  });
}

/* ---- table view: renderTableView + sortTable ---- */
function renderTable() {
  const heads = [t('colTile'), t('colLane'), t('colDate'), t('colTags')];
  let rows = '';
  MODEL.columns.forEach((col) => (col.tiles || []).forEach((tile) => {
    const tid = TILES.push(tile) - 1;
    const meta = extractMeta(String(tile.text), cfg.dateTrigger, cfg.timeTrigger);
    const title = tilePlainText(meta.clean.split('\n')[0] || '');
    const lane = parseWip(col.title || '').title;
    const date = meta.date ? formatDate(meta.date) : '';
    const dcls = meta.date ? dateClass(meta.date) : '';
    const tags = extractTags(tile.text);
    rows += '<tr class="tugtile__row" data-tid="' + tid + '">'
      + '<td class="tugtile__row-title"><span class="tugtile__row-text">' + esc(title) + '</span></td>'
      + '<td class="tugtile__row-lane">' + esc(lane) + '</td>'
      + '<td class="tugtile__row-date"><span class="' + dcls + '">' + esc(date) + '</span></td>'
      + '<td class="tugtile__row-tags">' + tags.map((t) => '<span class="tugtile__tag" data-tag="' + esc(t) + '">' + esc(t) + '</span>').join('') + '</td></tr>';
  }));
  board.innerHTML = '<div class="tugtile__table-wrap"><table class="tugtile__table"><thead><tr>'
    + heads.map((h, i) => '<th data-ci="' + i + '">' + h + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  board.querySelectorAll('.tugtile__table th').forEach((th) => { th.onclick = () => sortTable(+th.dataset.ci); });
  board.querySelectorAll('.tugtile__row-tags .tugtile__tag').forEach((c) => { const k = c.dataset.tag; const col = cfg.tagColors[k];
    if (col) { if (col.backgroundColor) c.style.backgroundColor = col.backgroundColor; if (col.color) c.style.color = col.color; }
    c.onclick = () => { searchTerm = k; applySearch(); }; });
}
function sortTable(ci) {
  const tbody = board.querySelector('.tugtile__table tbody'); if (!tbody) return;
  const dir = (tableSort && tableSort.ci === ci) ? -tableSort.dir : 1; tableSort = { ci, dir };
  const val = (tr) => { const t = TILES[+tr.dataset.tid] || {};
    if (ci === 1) return tr.querySelector('.tugtile__row-lane').textContent || '';
    if (ci === 2) return extractMeta(t.text || '', cfg.dateTrigger, cfg.timeTrigger).date || '￿';
    if (ci === 3) return extractTags(t.text || '')[0] || '￿';
    return (t.text || '').split('\n')[0]; };
  [...tbody.querySelectorAll('tr')].sort((a, b) => dir * val(a).localeCompare(val(b), 'zh-Hant')).forEach((tr) => tbody.appendChild(tr));
}

/* ---- the render dispatcher (board / table), preserving scroll ---- */
function render() {
  TILES = []; COLS = [];
  const snap = { left: board.scrollLeft, lists: [...board.querySelectorAll('.tugtile__list')].map((l) => l.scrollTop) };
  document.querySelector('.tugtile').classList.toggle('tugtile--hide-counts', cfg.hideCounts);
  if (viewMode === 'table') { renderTable(); applySearch(); refreshViewCycle(); return; }
  board.innerHTML = MODEL.columns.map((col, ci) => laneHtml(col, ci)).join('') + '<div class="tugtile__addcol"><div class="tugtile__addcol-btn">' + esc(t('addLaneBtn')) + '</div></div>';
  renumberAll(); decorateTags(); wireSortables();
  board.scrollLeft = snap.left; board.querySelectorAll('.tugtile__list').forEach((l, i) => { if (snap.lists[i] != null) l.scrollTop = snap.lists[i]; });
  applySearch(); refreshViewCycle(); refreshFoldBtn();
}

/* ---- drag (makeSortable / makeBoardSortable + DRAG_TOUCH + auto-scroll) ---- */
function wireSortables() {
  sortables.length = 0;
  board.querySelectorAll('.tugtile__list').forEach((list) => {
    sortables.push(new Sortable(list, {
      group: 'tugtile', disabled: locked, animation: 150, ...DRAG_TOUCH, scroll: false,
      ghostClass: 'tugtile__tile--ghost', chosenClass: 'tugtile__tile--chosen', dragClass: 'tugtile__tile--drag',
      onStart: () => { dragging = true; _preDrag = serializeFile(MODEL); startAutoScroll(); },
      onEnd: () => { stopAutoScroll(); lastDragEnd = Date.now(); dragging = false; renumberAll(); syncModel(); undoStack.push(_preDrag); redoStack.length = 0; writeBack(); updateUndoRedo(); },
    }));
  });
  sortables.push(new Sortable(board, {

    { icon: 'trash', label: t('deleteLaneMenu'), danger: true, onClick: () => deleteLane(laneEl) },
  ]);
}
function addTileOp(laneEl) { const ci = +laneEl.dataset.ci; modalCardEdit(t('addTileBtn'), '', (v) => { if (!v.trim()) return; pushUndo(); MODEL.columns[ci].tiles.push(newTile(v)); commit(); }); }

/* ---- archive ---- */
function addToArchive(raw) {
  let a = (MODEL.archive || '').trim();
  if (!a) a = '***\n\n## ' + (t('archiveTitle') || 'Archive') + '\n';
  MODEL.archive = a + '\n' + raw;
}
function listArchive() { return (MODEL.archive || '').split('\n').filter((l) => /^- \[.\]/.test(l)); }
function openArchiveView() {
  const items = listArchive();
  const body = items.length ? items.map((l, i) => '<div class="tw-arc-row"><div class="txt">' + esc(l.replace(/^- \[.\]\s*/, '')) + '</div>'
    + '<button class="tw-btn" data-r="' + i + '">' + esc(t('restore')) + '</button><button class="tw-btn" data-d="' + i + '">' + esc(t('deleteArchived')) + '</button></div>').join('')
    : '<div style="color:var(--text-muted)">' + esc(t('archiveEmpty')) + '</div>';
  modal({ title: t('archiveTitle'), bodyHtml: body, onBuild: (box, close) => {
    box.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => { const items2 = listArchive(); const raw = items2[+b.dataset.r]; pushUndo(); MODEL.archive = (MODEL.archive || '').split('\n').filter((l) => l !== raw).join('\n'); MODEL.columns[0].tiles.push(newTile(raw.replace(/^- \[.\]\s*/, ''), (/^- \[(.)\]/.exec(raw) || [, ' '])[1])); commit(); close(); });
    box.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { const items2 = listArchive(); const raw = items2[+b.dataset.d]; pushUndo(); MODEL.archive = (MODEL.archive || '').split('\n').filter((l) => l !== raw).join('\n'); commit(); close(); });
  } });
}

/* ---- board settings ---- */
function openSettings() {
  const s = MODEL.settings || {};
  const rows = [
    ['show-checkboxes', t('setShowCheckboxes'), cfg.showCheckbox],
    ['hide-card-count', t('setHideCount'), cfg.hideCounts],
    ['show-relative-date', t('setRelativeDate'), cfg.showRelativeDate],
    ['move-tags', t('setMoveTags'), cfg.moveTags],
  ];
  const body = rows.map(([k, label, on]) => '<div class="tw-set-row"><label>' + esc(label) + '</label><input type="checkbox" data-k="' + k + '"' + (on ? ' checked' : '') + '></div>').join('');
  modal({ title: t('boardSettingsTitle'), okLabel: t('save'), bodyHtml: body, onOk: (box) => {
    pushUndo(); const ns = { ...(MODEL.settings || {}) };
    box.querySelectorAll('[data-k]').forEach((c) => { ns[c.dataset.k] = c.checked; });
    MODEL.settings = ns; MODEL.post = setSettingsBlock(ns); cfg = buildCfg(ns); commit();
  } });
}
function setSettingsBlock(s) { return '%% tugtile:settings\n```\n' + JSON.stringify(s) + '\n```\n%%'; }

/* ---- markdown (raw whole-file) editor ---- */
function openMarkdownEditor() { modalEdit(t('editMarkdown'), serializeFile(MODEL), (v) => { pushUndo(); MODEL = parseFile(v); applyCollapse(); cfg = buildCfg(MODEL.settings); commit(); }); }

/* ---- board click + keyboard routing ---- */
board.addEventListener('click', (e) => {
  if (dragging || Date.now() - lastDragEnd < 250) return;
  const addTileBtn = e.target.closest('.tugtile__add-btn'); if (addTileBtn) { if (!locked) addTileOp(addTileBtn.closest('.tugtile__lane')); return; }
  const addColBtn = e.target.closest('.tugtile__addcol-btn'); if (addColBtn) { if (!locked) addLaneOp(); return; }
  const more = e.target.closest('.tugtile__tile-more'); if (more) { const r = more.getBoundingClientRect(); openTileMenu(more.closest('.tugtile__tile'), r.left, r.bottom); return; }
  const laneMore = e.target.closest('.tugtile__lane-more'); if (laneMore) { const r = laneMore.getBoundingClientRect(); openLaneMenu(laneMore.closest('.tugtile__lane'), r.left, r.bottom); return; }
  const cb = e.target.closest('.tugtile__check'); if (cb) { if (!locked) toggleCheckOp(cb.closest('.tugtile__tile')); return; }
  const chev = e.target.closest('.tugtile__lane-chevron, .tugtile__lane-title-v');
  if (chev) { toggleCollapse(chev.closest('.tugtile__lane')); return; }
  const title = e.target.closest('.tugtile__lane-title');
  if (title) { const lane = title.closest('.tugtile__lane'); if (lane.dataset.collapsed === 'true') toggleCollapse(lane); else if (!locked) renameLane(lane); return; }
  const tile = e.target.closest('.tugtile__tile');
  if (tile) {
    if (e.target.closest('a, .lnk, .tag')) return;
    if (tile.dataset.long === 'true' && tile.classList.contains('tugtile__tile--folded')) { expandCard(tile); return; }
    if (!locked) editTile(tile); else collapseExpanded();
    return;
  }
  collapseExpanded();
});
board.addEventListener('contextmenu', (e) => {
  const tile = e.target.closest('.tugtile__tile');
  const laneHead = e.target.closest('.tugtile__lane-head');
  if (tile) { e.preventDefault(); openTileMenu(tile, e.clientX, e.clientY); }
  else if (laneHead) { e.preventDefault(); openLaneMenu(laneHead.closest('.tugtile__lane'), e.clientX, e.clientY); }
});
board.addEventListener('keydown', (e) => {
  const tile = e.target.closest && e.target.closest('.tugtile__tile');
  if (!tile || e.target !== tile || locked) return;
  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  if (keyMoveCard(tile, e.key)) tile.focus();
});
function keyMoveCard(tileEl, key) {
  const list = tileEl.closest('.tugtile__list'), lane = tileEl.closest('.tugtile__lane'); if (!list || !lane) return false;
  const isTile = (el) => el && el.classList && el.classList.contains('tugtile__tile');
  const pre = serializeFile(MODEL);
  if (key === 'ArrowUp') { const prev = tileEl.previousElementSibling; if (!isTile(prev)) return false; list.insertBefore(tileEl, prev); }
  else if (key === 'ArrowDown') { const next = tileEl.nextElementSibling; if (!isTile(next)) return false; list.insertBefore(next, tileEl); }
  else { const lanes = [...board.querySelectorAll('.tugtile__lane')]; const target = lanes[lanes.indexOf(lane) + (key === 'ArrowLeft' ? -1 : 1)]; const tl = target && target.querySelector('.tugtile__list'); if (!tl) return false; tl.appendChild(tileEl); }
  renumberAll(); syncModel(); undoStack.push(pre); redoStack.length = 0; writeBack(); updateUndoRedo(); return true;
}

/* ---- open / load ---- */
async function openFile() {
  try { const [h] = await window.showOpenFilePicker({ types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }] }); fileHandle = h; load(await (await h.getFile()).text()); } catch (e) {}
}
function load(md) {
  MODEL = parseFile(md);
  cfg = buildCfg(MODEL.settings);
  (MODEL.columns || []).forEach((c, i) => { c._collapsed = !!((MODEL.settings && MODEL.settings['list-collapse']) || [])[i]; });
  cardsExpanded = false; expandedEl = null; searchTerm = ''; tableSort = null; viewMode = 'board';
  render();
}

const LOCALE = (() => { const l = (navigator.language || 'en').toLowerCase(); if (l.startsWith('ja')) return 'ja-JP'; if (l.startsWith('ko')) return 'ko-KR'; if (l.startsWith('zh')) return 'zh-TW'; return 'en-US'; })();
window.__load = (md) => { fileHandle = null; load(md); };
fetch('./i18n/' + LOCALE + '.json').then((r) => r.json()).then((j) => { TR = j; }).catch(() => {}).finally(() => { buildHeader(); load(SAMPLE); window.__ready = true; });
